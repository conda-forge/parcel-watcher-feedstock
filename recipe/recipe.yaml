schema_version: 1

context:
  version: "2.6.0"

package:
  name: parcel-watcher
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@parcel/watcher/-/watcher-${{ version }}.tgz
  sha256: ab42807be3df24a12d01e31568a7e61def1a4bee636a7c60a397319eff677e95

build:
  number: 1
  variant:
    ignore_keys:
      - python
  script:
    - if: win
      then:
        - call npm install --ignore-scripts --omit=dev --omit=optional
        - call node-gyp rebuild
        - node "%RECIPE_DIR%\install.cjs"
      else:
        - npm install --ignore-scripts --omit=dev --omit=optional
        - node-gyp rebuild
        - node "$RECIPE_DIR/install.cjs"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - node-gyp
    - python
    - if: unix
      then: make
  host:
    - nodejs >=24
  run:
    - nodejs >=24

tests:
  - files:
      recipe:
        - test.cjs
    script:
      - node test.cjs

about:
  homepage: https://github.com/parcel-bundler/watcher
  repository: https://github.com/parcel-bundler/watcher
  summary: Native Node.js filesystem watcher and snapshot library
  license: MIT AND Apache-2.0
  license_file:
    - LICENSE
    - node_modules/detect-libc/LICENSE
    - node_modules/is-glob/LICENSE
    - node_modules/is-extglob/LICENSE
    - node_modules/picomatch/LICENSE
    - node_modules/node-addon-api/LICENSE.md

extra:
  recipe-maintainers:
    - timkpaine
